name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ls "$ANDROID_HOME/platforms" || true
      - name: build
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || { grep -v "^> Task" build.log | tail -45 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - run: cp app/build/outputs/apk/release/app-release.apk gojoseon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gojoseon-apk
          path: gojoseon.apk
